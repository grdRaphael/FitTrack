<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d16" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f0f4fa" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FitTrack — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
  <script src="./js/supabase.js"></script>
  <script src="./entrainements.js"></script>
</head>
<body data-page="accueil">

  <!-- ── Navbar ──────────────────────────────────────────────────────────── -->
  <nav class="navbar" style="position:fixed;top:0;left:0;right:0;z-index:50">
    <div style="max-width:1200px;margin:0 auto;padding:0 20px;height:64px;display:flex;align-items:center;justify-content:space-between">
      <a href="./index.html" class="nav-logo">
        <span class="nav-logo-badge">FT</span>
        <span>FitTrack</span>
      </a>
      <div style="display:flex;align-items:center;gap:4px">
        <a href="./index.html" class="nav-link active">Dashboard</a>
        <a href="./pages/calendrier.html" class="nav-link">Calendrier</a>
        <a href="./pages/exercices.html" class="nav-link" id="nav-ex">Exercices</a>
        <a href="./pages/importer.html" class="nav-link">+ Import</a>
        <a href="./pages/parametres.html" class="nav-link">Réglages</a>
      </div>
    </div>
  </nav>

  <style>
    @media (max-width:639px) { #nav-journal, #nav-ex { display:none; } }
  </style>

  <!-- ── Loading ─────────────────────────────────────────────────────────── -->
  <div id="loading" style="min-height:100vh;display:flex;align-items:center;justify-content:center">
    <div style="text-align:center">
      <div class="spinner" style="margin:0 auto 16px"></div>
      <p class="text-secondary text-sm">Chargement des données...</p>
    </div>
  </div>

  <!-- ── App ─────────────────────────────────────────────────────────────── -->
  <div id="app" class="hidden page-wrapper">

    <!-- En-tête page -->
    <div class="mb-6">
      <h1 class="page-title">Dashboard</h1>
      <p class="page-subtitle">Vue d'ensemble de tes performances sportives</p>
    </div>

    <!-- Filtres période -->
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px">
      <button class="period-btn" data-days="7">7 jours</button>
      <button class="period-btn active" data-days="30">30 jours</button>
      <button class="period-btn" data-days="90">90 jours</button>
      <button class="period-btn" data-days="0">Tout</button>
    </div>

    <!-- Stats -->
    <div id="stats-grid" class="grid-4 mb-6"></div>

    <!-- Graphique volume -->
    <div class="card mb-6">
      <div class="card-title mb-4">Volume total par séance (kg)</div>
      <div class="chart-container" style="height:220px"><canvas id="chart-volume"></canvas></div>
    </div>

    <!-- Carrousel médailles PR -->
    <div id="pr-carousel-section" class="mb-6"></div>

    <!-- Alertes -->
    <div id="alerts-grid" class="grid-2 mb-6"></div>

    <!-- Séances récentes -->
    <div class="card">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-semibold">Dernières séances</h3>
        <a href="./pages/exercices.html" style="font-size:.8125rem;color:var(--accent);text-decoration:none">Voir exercices →</a>
      </div>
      <div id="recent-sessions"></div>
    </div>

  </div>

  <script src="./js/utils.js"></script>
  <script src="./js/charts.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
