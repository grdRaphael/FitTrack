<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d16" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f0f4fa" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FitTrack — Calendrier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../entrainements.js"></script>
  <style>
    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .cal-nav-center {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cal-nav-btn {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 1.125rem;
      line-height: 1;
      transition: all .15s;
    }
    .cal-nav-btn:hover { border-color: var(--accent); color: var(--accent); }
    .cal-month-title {
      font-size: 1.0625rem;
      font-weight: 700;
      min-width: 160px;
      text-align: center;
      letter-spacing: -.01em;
    }
    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 4px;
    }
    .cal-weekday {
      text-align: center;
      font-size: .625rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-muted);
      padding: 6px 0 8px;
    }
    .cal-weekday.weekend { color: var(--accent); opacity: .7; }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }
    .cal-day {
      min-height: 84px;
      border-radius: 8px;
      padding: 8px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      position: relative;
      transition: border-color .15s, transform .15s, box-shadow .15s, background .15s;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
    }
    .cal-day--empty {
      background: transparent;
      border-color: transparent;
      pointer-events: none;
    }
    .cal-day--inactive {
      opacity: .45;
    }
    .cal-day--has-session {
      cursor: pointer;
      background: var(--bg-card);
      border-color: var(--border);
    }
    .cal-day--has-session::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--session-color, var(--accent));
      border-radius: 8px 8px 0 0;
    }
    .cal-day--has-session:hover {
      border-color: var(--border-light);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }
    .cal-day--today {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 1px var(--accent);
    }
    .cal-day--active {
      border-color: var(--accent) !important;
      background: var(--accent-glow) !important;
    }
    .cal-day-num {
      font-size: .8125rem;
      font-weight: 600;
      color: var(--text-muted);
      line-height: 1;
    }
    .cal-day--has-session .cal-day-num { color: var(--text-primary); }
    .cal-day--today .cal-day-num { color: var(--accent); font-weight: 800; }
    .cal-session-tag {
      display: block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: .5625rem;
      font-weight: 700;
      letter-spacing: .02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cal-session-vol {
      font-size: .5625rem;
      color: var(--text-muted);
      font-weight: 500;
      padding-left: 1px;
    }
    .month-stats {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .month-stat {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: .8125rem;
      color: var(--text-secondary);
    }
    .month-stat-val {
      font-weight: 700;
      color: var(--text-primary);
    }
    .day-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-top: 12px;
      animation: panelIn .15s ease-out;
    }
    @keyframes panelIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .day-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .day-panel-session {
      display: block;
      padding: 10px 14px;
      background: var(--bg-surface);
      border-left: 3px solid currentColor;
      border-radius: 0 8px 8px 0;
      text-decoration: none;
      color: var(--text-primary);
      margin-bottom: 6px;
      transition: background .12s, transform .12s;
    }
    .day-panel-session:last-child { margin-bottom: 0; }
    .day-panel-session:hover { background: var(--bg-card-hover); transform: translateX(3px); }
    /* Mobile */
    @media (max-width: 600px) {
      .cal-day { min-height: 52px; padding: 6px 5px; gap: 3px; }
      .cal-session-tag, .cal-session-vol { display: none; }
      .cal-day--has-session .cal-day-dot {
        display: block;
        width: 5px; height: 5px;
        border-radius: 50%;
        background: var(--session-color, var(--accent));
        margin-top: 2px;
      }
      .cal-day-dot { display: none; }
      .cal-month-title { min-width: 120px; }
    }
  </style>
</head>
<body data-page="calendrier">

  <!-- Navbar -->
  <nav class="navbar" style="position:fixed;top:0;left:0;right:0;z-index:50">
    <div style="max-width:1200px;margin:0 auto;padding:0 20px;height:64px;display:flex;align-items:center;justify-content:space-between">
      <a href="../index.html" class="nav-logo">
        <span class="nav-logo-badge">FT</span>
        <span>FitTrack</span>
      </a>
      <div style="display:flex;align-items:center;gap:4px">
        <a href="../index.html" class="nav-link">Dashboard</a>
        <a href="./journal.html" class="nav-link">Journal</a>
        <a href="./calendrier.html" class="nav-link active">Calendrier</a>
        <a href="./exercices.html" class="nav-link">Exercices</a>
        <a href="./importer.html" class="nav-link">+ Import</a>
        <button class="theme-toggle" id="theme-toggle"><span id="theme-icon">☀️</span></button>
      </div>
    </div>
  </nav>

  <div id="loading" style="min-height:100vh;display:flex;align-items:center;justify-content:center">
    <div style="text-align:center">
      <div class="spinner" style="margin:0 auto 16px"></div>
      <p class="text-secondary text-sm">Chargement...</p>
    </div>
  </div>

  <div id="app" class="hidden page-wrapper" style="max-width:900px">

    <div class="mb-6">
      <h1 class="page-title">Calendrier</h1>
      <p class="page-subtitle">Vue mensuelle de tes séances — clique sur un jour pour le détail</p>
    </div>

    <div class="card">
      <!-- Navigation mois -->
      <div class="cal-nav">
        <div class="cal-nav-center">
          <button class="cal-nav-btn" id="cal-prev" aria-label="Mois précédent">‹</button>
          <div class="cal-month-title" id="calendar-title">—</div>
          <button class="cal-nav-btn" id="cal-next" aria-label="Mois suivant">›</button>
          <button class="btn btn-ghost" id="cal-today" style="font-size:.8125rem;padding:6px 12px">Aujourd'hui</button>
        </div>
        <div class="month-stats" id="calendar-month-stats"></div>
      </div>

      <!-- En-têtes jours -->
      <div class="cal-weekdays">
        <div class="cal-weekday">Lu</div>
        <div class="cal-weekday">Ma</div>
        <div class="cal-weekday">Me</div>
        <div class="cal-weekday">Je</div>
        <div class="cal-weekday">Ve</div>
        <div class="cal-weekday weekend">Sa</div>
        <div class="cal-weekday weekend">Di</div>
      </div>

      <!-- Grille jours -->
      <div class="cal-grid" id="calendar-grid"></div>
    </div>

    <!-- Panneau détail du jour sélectionné -->
    <div id="day-panel" class="day-panel hidden"></div>

  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/charts.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
