<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d16" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f0f4fa" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FitTrack — Réglages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase.js"></script>
  <style>
    .settings-section {
      margin-bottom: 28px;
    }
    .settings-label {
      font-size: .6875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-muted);
      margin-bottom: 10px;
      padding-left: 4px;
    }
    .settings-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    @media (max-width: 640px) {
      .settings-card { border: none; box-shadow: 0 2px 18px rgba(0,0,0,0.25); border-radius: 18px; }
    }
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .settings-row:last-child { border-bottom: none; }
    .settings-row-label {
      font-size: .9375rem;
      font-weight: 500;
      color: var(--text-primary);
    }
    .settings-row-sub {
      font-size: .75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    /* Toggle switch */
    .toggle-switch {
      position: relative;
      width: 50px;
      height: 28px;
      flex-shrink: 0;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle-track {
      position: absolute;
      inset: 0;
      border-radius: 28px;
      background: var(--border-light);
      cursor: pointer;
      transition: background .2s;
    }
    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      transition: transform .2s;
    }
    input:checked + .toggle-track { background: var(--accent); }
    input:checked + .toggle-track::after { transform: translateX(22px); }
    /* Export button */
    .btn-export {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: .8125rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      padding: 7px 14px;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      transition: opacity .15s;
    }
    .btn-export:disabled { opacity: .5; cursor: default; }
    /* Danger button */
    .btn-danger {
      background: transparent;
      color: var(--red);
      border: none;
      font-size: .9375rem;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    /* Avatar */
    .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: .875rem;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
  </style>
</head>
<body data-page="parametres">

  <!-- ── Navbar desktop uniquement ─────────────────────────────────────────── -->
  <nav class="navbar" style="position:fixed;top:0;left:0;right:0;z-index:50">
    <div style="max-width:1200px;margin:0 auto;padding:0 20px;height:64px;display:flex;align-items:center;justify-content:space-between">
      <a href="../index.html" class="nav-logo">
        <span class="nav-logo-badge">FT</span>
        <span>FitTrack</span>
      </a>
      <div style="display:flex;align-items:center;gap:4px">
        <a href="../index.html" class="nav-link">Dashboard</a>
        <a href="./calendrier.html" class="nav-link">Calendrier</a>
        <a href="./exercices.html" class="nav-link">Exercices</a>
        <a href="./importer.html" class="nav-link">+ Import</a>
        <a href="./parametres.html" class="nav-link active">Réglages</a>
      </div>
    </div>
  </nav>

  <!-- ── Loading ─────────────────────────────────────────────────────────── -->
  <div id="loading" style="min-height:100vh;display:flex;align-items:center;justify-content:center">
    <div class="spinner" style="margin:0 auto"></div>
  </div>

  <!-- ── App ─────────────────────────────────────────────────────────────── -->
  <div id="app" class="hidden page-wrapper" style="max-width:600px">

    <div class="mb-6">
      <h1 class="page-title">Réglages</h1>
    </div>

    <!-- Compte -->
    <div class="settings-section">
      <div class="settings-label">Compte</div>
      <div class="settings-card">
        <div class="settings-row">
          <div class="flex items-center gap-3">
            <div class="avatar" id="user-avatar">—</div>
            <div>
              <div class="settings-row-label" id="user-email">—</div>
              <div class="settings-row-sub">Connecté</div>
            </div>
          </div>
        </div>
        <div class="settings-row">
          <div>
            <div class="settings-row-label">Se déconnecter</div>
          </div>
          <button class="btn-danger" id="logout-btn">Quitter →</button>
        </div>
      </div>
    </div>

    <!-- Apparence -->
    <div class="settings-section">
      <div class="settings-label">Apparence</div>
      <div class="settings-card">
        <div class="settings-row">
          <div>
            <div class="settings-row-label">Mode sombre</div>
            <div class="settings-row-sub">Adapté à l'heure et à la lumière</div>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="dark-mode-toggle">
            <span class="toggle-track"></span>
          </label>
        </div>
      </div>
    </div>

    <!-- Données -->
    <div class="settings-section">
      <div class="settings-label">Données</div>
      <div class="settings-card">
        <div class="settings-row">
          <div>
            <div class="settings-row-label">Exporter mes séances</div>
            <div class="settings-row-sub">Télécharge toutes tes séances en JSON</div>
          </div>
          <button class="btn-export" id="export-btn">↓ Export</button>
        </div>
      </div>
    </div>

    <!-- App -->
    <div class="settings-section">
      <div class="settings-label">Application</div>
      <div class="settings-card">
        <div class="settings-row">
          <div class="settings-row-label">Version</div>
          <span class="text-muted text-sm">1.0.0</span>
        </div>
        <div class="settings-row">
          <div class="settings-row-label">Stockage</div>
          <span class="text-muted text-sm">Supabase</span>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ── Thème ──────────────────────────────────────────────────────────────
    function initTheme() {
      const saved = localStorage.getItem('ft-theme');
      if (saved === 'light') document.documentElement.classList.add('light-mode');
    }
    initTheme();

    // ── Bottom nav minimal ─────────────────────────────────────────────────
    function renderBottomNav() {
      const p = './';
      const SVG = {
        accueil:    `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>`,
        calendrier: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 3h-1V1h-2v2H7V1H5v2H4C2.9 5 2 5.9 2 7v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 18H4V8h16v13z"/></svg>`,
        exercices:  `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22l1.43-1.43L16.29 22l2.14-2.14 1.43 1.43 1.43-1.43-1.43-1.43L22 16.29z"/></svg>`,
        importer:   `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>`,
        parametres: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.63-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>`,
      };
      const items = [
        { id: 'accueil',    label: 'Home',      href: '../index.html' },
        { id: 'calendrier', label: 'Calendrier', href: p + 'calendrier.html' },
        { id: 'exercices',  label: 'Exercices',  href: p + 'exercices.html' },
        { id: 'importer',   label: 'Import',     href: p + 'importer.html' },
        { id: 'parametres', label: 'Réglages',   href: p + 'parametres.html' },
      ];
      const nav = document.createElement('nav');
      nav.className = 'bottom-nav';
      nav.setAttribute('aria-label', 'Navigation principale');
      nav.innerHTML = items.map(item =>
        `<a href="${item.href}" class="bottom-nav-item${item.id === 'parametres' ? ' active' : ''}" aria-label="${item.label}">
          <span class="bottom-nav-icon">${SVG[item.id]}</span>
          <span>${item.label}</span>
        </a>`
      ).join('');
      document.body.appendChild(nav);
    }
    renderBottomNav();

    // ── Init ───────────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {
      const loadingEl = document.getElementById('loading');
      const appEl     = document.getElementById('app');

      if (typeof _sb === 'undefined' || !_sb) {
        window.location.href = '../index.html'; return;
      }

      const { data: { session } } = await _sb.auth.getSession();
      if (!session) { window.location.href = '../index.html'; return; }

      // Afficher les infos utilisateur
      const email = session.user.email;
      document.getElementById('user-email').textContent = email;
      document.getElementById('user-avatar').textContent = email.charAt(0).toUpperCase();

      // Toggle dark mode
      const toggle = document.getElementById('dark-mode-toggle');
      toggle.checked = !document.documentElement.classList.contains('light-mode');
      toggle.addEventListener('change', () => {
        const isDark = toggle.checked;
        document.documentElement.classList.toggle('light-mode', !isDark);
        localStorage.setItem('ft-theme', isDark ? 'dark' : 'light');
      });

      // Export
      document.getElementById('export-btn').addEventListener('click', async () => {
        const btn = document.getElementById('export-btn');
        btn.disabled = true;
        btn.textContent = '…';
        try {
          const { data, error } = await _sb
            .from('sessions')
            .select('data')
            .order('date', { ascending: true });
          if (error) throw error;
          const sessions = data.map(row => row.data);
          const blob = new Blob([JSON.stringify(sessions, null, 2)], { type: 'application/json' });
          const url  = URL.createObjectURL(blob);
          const a    = document.createElement('a');
          const date = new Date().toISOString().slice(0, 10);
          a.href     = url;
          a.download = `fittrack-export-${date}.json`;
          a.click();
          URL.revokeObjectURL(url);
          btn.textContent = '✓ Téléchargé';
          setTimeout(() => { btn.textContent = '↓ Export'; btn.disabled = false; }, 2500);
        } catch (e) {
          btn.textContent = 'Erreur';
          btn.disabled = false;
          console.error(e);
        }
      });

      // Logout
      document.getElementById('logout-btn').addEventListener('click', async () => {
        await _sb.auth.signOut();
        window.location.href = '../index.html';
      });

      loadingEl.classList.add('hidden');
      appEl.classList.remove('hidden');
    });
  </script>
</body>
</html>
